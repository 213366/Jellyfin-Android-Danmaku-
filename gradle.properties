# Gradle
org.gradle.jvmargs=-Xmx2048m

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default

# 自定义构建：版本号与签名配置
jellyfin.version=v1.0.0
keystore.file=../keystore/danmaku-release.jks
keystore.password=danmaku-jellyfin
signing.key.alias=danmaku
signing.key.password=danmaku-jellyfin
