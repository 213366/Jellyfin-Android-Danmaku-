# Gradle
org.gradle.jvmargs=-Xmx2048m

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default

# 自定义构建：版本号
jellyfin.version=v1.1.1

# 签名配置不放在仓库中。以下属性请放在 GRADLE_USER_HOME/gradle.properties
# （本机为 %USERPROFILE%\.gradle\gradle.properties）或通过 -P 传入：
#   keystore.file / keystore.password / signing.key.alias / signing.key.password
